<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pony Notebook</title>
<style>
:root{color-scheme:light;--pink:#ff8fc7;--lav:#c9a7ff;--mint:#9be8d0;--sky:#9fd8ff;--yel:#ffe48a;--ink:#5a3a6e}
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);min-height:100vh;
background:linear-gradient(135deg,#ffe3f3,#e8dcff 40%,#d6f3ff 75%,#e0fff3);background-attachment:fixed}
.sticker{position:fixed;font-size:42px;pointer-events:none;opacity:.85;z-index:0;filter:drop-shadow(0 3px 2px #0002);animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px) rotate(6deg)}}
header{position:relative;z-index:1;text-align:center;padding:14px 10px 4px}
h1{margin:0;font-size:30px;background:linear-gradient(90deg,#ff6fb5,#b78bff,#4fc3f7,#5fe0b0,#ffd54f);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{position:relative;z-index:1;display:flex;gap:14px;padding:12px;max-width:1200px;margin:auto}
.side{width:230px;flex:none;background:#fff9;border:3px solid var(--pink);border-radius:22px;padding:10px;max-height:80vh;overflow:auto}
.main{flex:1;min-width:0;background:#fffc;border:3px solid var(--lav);border-radius:22px;padding:12px}
.pg{display:flex;align-items:center;gap:6px;padding:8px 10px;margin:5px 0;border-radius:14px;cursor:pointer;background:#fff;border:2px solid transparent}
.pg:hover{border-color:var(--sky)}.pg.on{background:linear-gradient(90deg,#ffd1ea,#e3d3ff);border-color:var(--pink)}
.pg b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.pg small{opacity:.6}
button,input[type=text]{font:inherit;border-radius:999px;border:2px solid var(--lav);padding:7px 13px;color:var(--ink);background:#fff}
button{cursor:pointer;background:linear-gradient(180deg,#fff,#f4e8ff);box-shadow:0 2px 0 var(--lav)}
button:active{transform:translateY(2px);box-shadow:none}
.pink{border-color:var(--pink);box-shadow:0 2px 0 var(--pink)}.mint{border-color:#5fd1ae;box-shadow:0 2px 0 #5fd1ae}.sky{border-color:#6bbdf0;box-shadow:0 2px 0 #6bbdf0}.red{border-color:#ff7a90;box-shadow:0 2px 0 #ff7a90}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
textarea{width:100%;height:58vh;border:3px dashed var(--pink);border-radius:18px;padding:14px;font:14px/1.5 ui-monospace,Consolas,monospace;color:#3b2550;background:#fffdfb;resize:vertical}
textarea:focus{outline:none;border-color:var(--lav)}
.meta{font-size:13px;opacity:.8;margin-top:6px}
code{display:block;background:#f6ecff;padding:8px 10px;border-radius:12px;word-break:break-all;font-size:12px;margin-top:6px;user-select:all}
label{font-size:13px;display:flex;align-items:center;gap:4px}
.cfg{margin-top:10px;font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--mint);padding:8px 18px;border-radius:999px;z-index:9;display:none;max-width:90vw}
@media(max-width:760px){.wrap{flex-direction:column}.side{width:auto;max-height:200px}}
</style></head><body>
<div class="sticker" style="left:2%;top:12%">🦄</div><div class="sticker" style="right:3%;top:10%;animation-delay:1s">🌈</div>
<div class="sticker" style="left:4%;bottom:10%;animation-delay:2s">⭐</div><div class="sticker" style="right:4%;bottom:8%;animation-delay:3s">🎀</div>
<div class="sticker" style="left:46%;bottom:2%;animation-delay:1.5s">💖</div><div class="sticker" style="right:1%;top:48%;animation-delay:2.5s">🍎</div>
<header><h1>🦄 Pony Notebook 🌈</h1></header>
<div class="wrap">
 <div class="side"><div class="row"><button class="pink" id="new">✨ New page</button></div><div id="list"></div>
  <div class="row" style="margin-top:12px"><button class="mint" id="all">📦 Download all (.zip)</button></div>
  <div class="cfg"><div class="row"><button class="sky" id="bm">🔖 Copy bookmarklet</button></div>
   <a id="bml" href="#" style="font-size:12px">⭐ Drag me to your bookmarks bar</a>
   <div class="row" style="margin-top:10px"><button id="lock">🔐 Change password</button></div></div></div>
 <div class="main">
  <div class="row"><input type="text" id="name" placeholder="Page name" style="flex:1;min-width:140px" disabled>
   <button class="mint" id="dl">⬇️ Download .txt</button><button class="sky" id="cp">📋 Copy wget</button>
   <button class="red" id="clr">🧹 Clear page</button><button class="red" id="del">🗑️ Delete</button></div>
  <div class="row"><label><input type="checkbox" id="tg" checked> 🏷️ Tag each paste</label>
   <input type="text" id="tag" placeholder="tag (optional)" style="width:140px">
   <span style="font-size:13px">↵ Every paste automatically starts on its own line</span></div>
  <textarea id="txt" placeholder="Paste or write here… (500,000+ characters is fine) 🌸" spellcheck="false" disabled></textarea>
  <div class="meta"><span id="cnt">0</span> chars · saved <span id="sv">—</span> · id <b id="pid"></b></div>
  <code id="wg"></code>
 </div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let readyRes;const ready=new Promise(r=>readyRes=r);
let pages={},order=[],cur=null,dirty=false,dirtyId=null,timer,chain=Promise.resolve(),seen={},opening=0;
let PW='';try{PW=localStorage.getItem('pony-pw')||''}catch(e){}
const toast=(m,ms)=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms||2200)};

async function api(path,method,body){
 for(;;){
  const r=await fetch('/api/'+path,{method:method||'GET',headers:{'Content-Type':'application/json','x-notebook-password':PW},body:body===undefined?undefined:JSON.stringify(body)});
  if(r.status===401){const p=prompt('🔐 Notebook password');if(p===null)throw new Error('Password needed');PW=p;try{localStorage.setItem('pony-pw',p)}catch(e){}continue}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)||('HTTP '+r.status));
  return j}}
const wget=id=>`wget -O page.txt "${location.origin}/p/${id}.txt"`;

function render(){const l=$('list');l.innerHTML='';order.forEach(id=>{const p=pages[id];
 const d=document.createElement('div');d.className='pg'+(id===cur?' on':'');d.innerHTML='<span>📄</span><b></b><small>'+(p.chars||0).toLocaleString()+'</small>';
 d.querySelector('b').textContent=p.name;d.onclick=()=>open(id);l.appendChild(d)})}
function upd(){const p=pages[cur];$('cnt').textContent=(p.content||'').length.toLocaleString();$('wg').textContent=wget(cur)}

async function open(id){
 if(!pages[id])return;const my=++opening;
 await flush();
 $('txt').disabled=$('name').disabled=true;
 try{const f=await api('page?id='+encodeURIComponent(id));if(my!==opening)return;
  Object.assign(pages[id],f);cur=id;history.replaceState(null,'','#p='+id);try{localStorage.setItem('pony-last',id)}catch(e){}
  $('name').value=f.name;$('txt').value=f.content;$('pid').textContent=id;
  $('txt').disabled=$('name').disabled=false;upd();render()}
 catch(e){toast('⚠️ '+e.message,4000)}}

function mark(){if(!cur)return;const p=pages[cur];p.content=$('txt').value;p.name=$('name').value||'Untitled';p.chars=p.content.length;
 dirty=true;dirtyId=cur;$('sv').textContent='…';clearTimeout(timer);timer=setTimeout(flush,900);upd();render()}
function flush(){clearTimeout(timer);if(!dirty)return chain;
 chain=chain.then(async()=>{if(!dirty)return;const id=dirtyId,p=pages[id];dirty=false;
  try{await api('page?id='+encodeURIComponent(id),'PUT',{name:p.name,content:p.content,paste_n:p.paste_n||0});$('sv').textContent=new Date().toLocaleTimeString()}
  catch(e){dirty=true;dirtyId=id;$('sv').textContent='⚠️ failed – retrying';toast('⚠️ Save failed: '+e.message,4000);timer=setTimeout(flush,5000)}});
 return chain}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

$('txt').addEventListener('input',mark);$('name').addEventListener('input',mark);
$('txt').addEventListener('paste',e=>{
 const t=e.clipboardData.getData('text');if(!t||!cur)return;e.preventDefault();
 const ta=$('txt'),s=ta.selectionStart,en=ta.selectionEnd,pre=ta.value.slice(0,s),p=pages[cur];
 p.paste_n=(p.paste_n||0)+1;
 let ins='';if(pre&&!pre.endsWith('\n'))ins+='\n';
 if($('tg').checked){const tag=$('tag').value.trim();ins+=`[paste #${p.paste_n}${tag?' · '+tag:''} · ${new Date().toISOString().slice(0,16).replace('T',' ')}]\n`}
 ins+=t+'\n';ta.setRangeText(ins,s,en,'end');mark()});

$('new').onclick=async()=>{try{await flush();const r=await api('pages','POST',{name:'Page '+(order.length+1)});pages[r.id]={...r,content:'',paste_n:0};order.push(r.id);await open(r.id)}catch(e){toast('⚠️ '+e.message,4000)}};
$('clr').onclick=()=>{if(confirm('Clear all content on this page?')){$('txt').value='';pages[cur].paste_n=0;mark();toast('🧹 Cleared!')}};
$('del').onclick=async()=>{if(!confirm('Delete this page for good?'))return;
 try{await api('page?id='+encodeURIComponent(cur),'DELETE');delete pages[cur];order=order.filter(x=>x!==cur);dirty=false;cur=null;
  if(!order.length){const r=await api('pages','POST',{name:'My first page 🌸'});pages[r.id]={...r,content:''};order.push(r.id)}await open(order[0])}
 catch(e){toast('⚠️ '+e.message,4000)}};
function dlBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('dl').onclick=()=>dlBlob(cur+'.txt',new Blob([$('txt').value],{type:'text/plain;charset=utf-8'}));
$('cp').onclick=()=>{navigator.clipboard.writeText(wget(cur)).then(()=>toast('📋 wget command copied'),()=>toast('Select the command below & copy'))};
$('lock').onclick=()=>{const p=prompt('Enter notebook password');if(p!==null){PW=p;try{localStorage.setItem('pony-pw',p)}catch(e){}toast('🔐 Saved in this browser')}};

/* zip (store) */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=~0;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return ~c>>>0};
function zip(files){const parts=[],cd=[];let off=0,cs=0;const e=new TextEncoder();
 for(const f of files){const nm=e.encode(f.name),c=crc(f.data),sz=f.data.length;
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
  parts.push(h,nm,f.data);
  const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint16(14,0x21,true);d.setUint32(16,c,true);d.setUint32(20,sz,true);d.setUint32(24,sz,true);d.setUint16(28,nm.length,true);d.setUint32(42,off,true);
  cd.push(d,nm);cs+=46+nm.length;off+=30+nm.length+sz}
 const z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cs,true);z.setUint32(16,off,true);
 return new Blob([...parts,...cd,z],{type:'application/zip'})}
$('all').onclick=async()=>{try{await flush();toast('📦 Gathering pages…');const e=new TextEncoder(),files=[];
 for(const id of order){const p=await api('page?id='+encodeURIComponent(id));
  files.push({name:((p.name||'').replace(/[^\w\- ]+/g,'').trim()||'page')+'-'+id+'.txt',data:e.encode(p.content)})}
 dlBlob('pony-notebook-all.zip',zip(files));toast('📦 Zip ready!')}catch(e){toast('⚠️ '+e.message,4000)}};

/* bookmarklet */
function bmCode(){const u=location.origin+location.pathname;
 return "javascript:(function(){var t=(getSelection().toString()||document.body.innerText),n=Date.now()+'-'+Math.random(),w=window.open("+JSON.stringify(u)+"),k=0,i=setInterval(function(){try{w.postMessage({mlp:1,nonce:n,title:document.title,url:location.href,text:t},'*')}catch(e){}if(++k>30)clearInterval(i)},400)})();"}
$('bml').setAttribute('href',bmCode());$('bml').onclick=e=>{e.preventDefault();toast('Drag it to your bookmarks bar 🔖')};
$('bm').onclick=()=>navigator.clipboard.writeText(bmCode()).then(()=>toast('🔖 Bookmarklet copied'));
addEventListener('message',async e=>{const d=e.data;if(!d||d.mlp!==1||seen[d.nonce]||typeof d.text!=='string')return;
 seen[d.nonce]=1;
 try{await ready;await flush();const r=await api('pages','POST',{name:(d.title||'Snapshot').slice(0,60),content:d.text});
  pages[r.id]={...r,content:d.text,paste_n:0};order.push(r.id);await open(r.id);toast('🌟 Snapshot saved — wget command is shown below',4000)}
 catch(err){toast('⚠️ '+err.message,5000)}});
addEventListener('hashchange',()=>{const m=location.hash.match(/p=([\w-]+)/);if(m&&pages[m[1]]&&m[1]!==cur)open(m[1])});

/* boot */
(async()=>{try{
 const rows=await api('pages');rows.forEach(r=>{pages[r.id]={...r,content:'',paste_n:0};order.push(r.id)});
 if(!order.length){const r=await api('pages','POST',{name:'My first page 🌸'});pages[r.id]={...r,content:'',paste_n:0};order.push(r.id)}
 const m=location.hash.match(/p=([\w-]+)/);let last=null;try{last=localStorage.getItem('pony-last')}catch(e){}
 const id=m&&pages[m[1]]?m[1]:(pages[last]?last:order[0]);render();await open(id)}
 catch(e){toast('⚠️ '+e.message,8000)}finally{readyRes()}})();
</script></body></html>
